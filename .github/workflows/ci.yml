name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Préparer la base
        run: bash db/setup.sh
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer
        working-directory: python-app
        run: pip install -r requirements.txt
      - name: Tester
        working-directory: python-app
        run: py.test -v

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer la base
        run: bash db/setup.sh
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Installer
        working-directory: node-app
        run: npm ci
      - name: Tester
        working-directory: node-app
        run: npm test

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer la base
        run: bash db/setup.sh
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Tester
        working-directory: java-app
        run: mvn -B package

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer la base
        run: bash db/setup.sh
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: pdo, pdo_pgsql }
      - name: Installer
        working-directory: php-app
        run: composer install --no-interaction
      - name: Tester
        working-directory: php-app
        run: vendor/bin/phpunit tests

  build:
    needs: [python, node, java, php]
    runs-on: ubuntu-latest
    steps:
      - name: Build terminé
        run: echo "Tous les tests sont passés. Build réussi."

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Déploiement en cours..."
          test -n "$TOKEN" && echo "Token présent"
